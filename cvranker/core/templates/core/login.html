{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow mt-12">
  <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>
  <form method="post">
    {% csrf_token %}
    <label class="block mb-2">Username</label>
    <input name="username" type="text" required class="w-full p-2 border rounded mb-3" value="{{ form.username.value|default:'' }}">
    <label class="block mb-2">Password</label>
    <input name="password" type="password" required class="w-full p-2 border rounded mb-4">
    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Login</button>
  </form>
  <p class="text-sm mt-4 text-center">Don't have an account? <a href="{% url 'register' %}" class="text-blue-600">Register</a></p>
</div>
{% endblock %}
